apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

android {
    signingConfigs {
        release {
            if (System.getenv("CMD_RELEASE_KEYSTORE") != null) {
                storeFile file(System.getenv("CMD_RELEASE_KEYSTORE"))
                storePassword System.getenv("CMD_RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CMD_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("CMD_RELEASE_KEY_PASSWORD")
            } else {
                def keystorePropertiesFile = rootProject.file("keystore.properties")
                if (keystorePropertiesFile.exists()) {
                    def props = new Properties()
                    props.load(new FileInputStream(keystorePropertiesFile))

                    if (props['storeFile'] && file(props['storeFile']).exists()) {
                        storeFile file(props['storeFile'])
                        storePassword props['storePassword']
                        keyAlias props['keyAlias']
                        keyPassword props['keyPassword']
                    }
                }
            }
        }
    }

    ndkVersion project.properties['de.felixnuesse.extract.ndkVersion']

    defaultConfig {
        generatedDensities = []
        vectorDrawables.generatedDensities = []
        applicationId 'de.felixnuesse.extract'
        minSdkVersion 23
        compileSdk 34
        targetSdkVersion 35
        versionCode 410
        versionName '2.5.6'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "java.lang.String", "CLI",
                System.getenv('RCX_BUILD_CLI')
                        ? System.getenv('RCX_BUILD_CLI')
                        : "\"c03129b6-b09f-9cb4-8fcd-7f143b8f94ef\""

        buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"${applicationId}.vcp\""

        setProperty("archivesBaseName", "roundsync_v" + versionName)

        externalNativeBuild {
            ndkBuild {
                arguments "LOCAL_LDFLAGS += -Wl,--build-id=none"
            }
        }
    }

    // ⭐ buildConfig + viewBinding
    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
            useLegacyPackaging true   // ✔ ORA nel blocco corretto
        }
    }

    androidResources {
        generateLocaleConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            manifestPlaceholders = [
                    appIcon     : "@mipmap/ic_launcher_debug",
                    appIconRound: "@mipmap/ic_launcher_debug_round"
            ]
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-DEBUG"
            buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"${defaultConfig.applicationId}.debug.vcp\""

            resValue("string", "app_name", "RS Debug")
            resValue("string", "app_short_name", "RS Debug")
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    appIcon     : "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher_round"
            ]
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        configureEach {
            jniLibs.srcDirs = ["lib"]
        }
    }

    flavorDimensions += 'edition'

    productFlavors {
        rs { dimension 'edition' }
        oss { dimension 'edition' }
    }

    splits {
        abi {
            enable true
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    project.ext.versionCodes = [
            'armeabi-v7a': 6,
            'arm64-v8a' : 7,
            'x86'       : 8,
            'x86_64'    : 9
    ]

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride =
                    project.ext.versionCodes.get(output.getFilter(com.android.build.OutputFile.ABI), 0)
                            + android.defaultConfig.versionCode
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = true
        warning 'MissingTranslation'
    }

    gradle.projectsEvaluated {
        preBuild.dependsOn(':rclone:buildAll')
    }

    namespace 'ca.pkay.rcloneexplorer'
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // il tuo blocco è invariato
}
