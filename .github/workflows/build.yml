name: Android CI Signed & Release

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Scegli architettura (Solo per build manuale)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
          - universal
  push:
    tags:
      - 'v*'

jobs:
  build-signed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # ... (Qui vanno i tuoi step JDK, Go, NDK che hai nel file originale) ...

    - name: Decode Keystore
      if: ${{ env.APP_KEYSTORE_BASE64 }} 
      run: |
        echo "$APP_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

    - name: Build Signed Release APK
      env:
        CMD_RELEASE_KEYSTORE: release.keystore
        CMD_RELEASE_KEYSTORE_PASSWORD: ${{ env.KEY_STORE_PASSWORD }}
        CMD_RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
        CMD_RELEASE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
      run: |
        # Logica di selezione:
        # Se è un tag, costruisce tutto (assembleOssRelease)
        # Se è manuale ed è scelta un'architettura specifica, usa il task mirato di Gradle
        if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.event.inputs.architecture }}" == "all" ]]; then
          echo "Building all architectures..."
          ./gradlew assembleOssRelease --stacktrace
        else
          ARCH="${{ github.event.inputs.architecture }}"
          # Converte arm64-v8a in Arm64V8a per il comando Gradle (CamelCase)
          GRADLE_ARCH=$(echo $ARCH | sed -r 's/(^|-)([a-z0-9])/\U\2/g')
          echo "Building specific architecture: $ARCH"
          ./gradlew "assembleOss${GRADLE_ARCH}Release" --stacktrace
        fi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: round-sync-${{ github.event.inputs.architecture || 'release' }}
        path: app/build/outputs/apk/oss/release/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/oss/release/*.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
