name: Android CI Signed & Release

on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: 'Build ARM64 (arm64-v8a)'
        type: boolean
        default: true
      build_armv7:
        description: 'Build ARMv7 (armeabi-v7a)'
        type: boolean
        default: false
      build_x86:
        description: 'Build x86'
        type: boolean
        default: false
      build_x64:
        description: 'Build x86_64'
        type: boolean
        default: false
      build_universal:
        description: 'Build Universal APK'
        type: boolean
        default: false
      send_telegram:
        description: 'Invia APK a Telegram'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-signed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c # Versione 25.2.9519653 richiesta da Round-Sync
        link-to-sdk: true

    - name: Decode Keystore
      if: ${{ env.APP_KEYSTORE_BASE64 }} 
      run: |
        mkdir -p app
        echo "$APP_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

    - name: Build Signed Release APK
      env:
        CMD_RELEASE_KEYSTORE: release.keystore
        CMD_RELEASE_KEYSTORE_PASSWORD: ${{ env.KEY_STORE_PASSWORD }}
        CMD_RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
        CMD_RELEASE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
      run: |
        # Costruiamo la lista delle architetture selezionate
        SELECTED_ABIS=""
        if [[ "${{ github.event.inputs.build_arm64 }}" == "true" ]]; then SELECTED_ABIS+="arm64-v8a,"; fi
        if [[ "${{ github.event.inputs.build_armv7 }}" == "true" ]]; then SELECTED_ABIS+="armeabi-v7a,"; fi
        if [[ "${{ github.event.inputs.build_x86 }}" == "true" ]]; then SELECTED_ABIS+="x86,"; fi
        if [[ "${{ github.event.inputs.build_x64 }}" == "true" ]]; then SELECTED_ABIS+="x86_64,"; fi
        
        # Pulizia virgola finale
        SELECTED_ABIS=${SELECTED_ABIS%,}

        if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ -z "$SELECTED_ABIS" ]] || [[ "${{ github.event.inputs.build_universal }}" == "true" ]]; then
          echo "Eseguo build completa (tutte le architetture)..."
          ./gradlew assembleOssRelease --stacktrace
        else
          echo "Eseguo build mirata per: $SELECTED_ABIS"
          ./gradlew assembleOssRelease -Pandroid.injected.abi=$SELECTED_ABIS --stacktrace
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: round-sync-build
        path: app/build/outputs/apk/oss/release/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/oss/release/*.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send to Telegram
      if: (github.event.inputs.send_telegram == 'true' || startsWith(github.ref, 'refs/tags/')) && success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🚀 *Nuova Build Disponibile*
          Repo: ${{ github.repository }}
          Branch/Tag: ${{ github.ref_name }}
          
          I file APK sono allegati qui sotto.
        document: |
          app/build/outputs/apk/oss/release/*.apk
