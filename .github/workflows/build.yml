name: Android CI Signed & Release

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Scegli architettura (Solo per build manuale)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
  push:
    tags:
      - 'v*'

jobs:
  build-signed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # --- SETUP (Reinserisci qui i tuoi step JDK, Go, NDK) ---
    # Esempio:
    # - name: Setup JDK
    #   uses: actions/setup-java@v4
    #   ...

    - name: Decode Keystore
      if: ${{ env.APP_KEYSTORE_BASE64 }} 
      run: |
        # Creiamo la cartella app se non esiste (per sicurezza) e decodifichiamo
        mkdir -p app
        echo "$APP_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

    - name: Build Signed Release APK
      env:
        CMD_RELEASE_KEYSTORE: release.keystore
        CMD_RELEASE_KEYSTORE_PASSWORD: ${{ env.KEY_STORE_PASSWORD }}
        CMD_RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
        CMD_RELEASE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
      run: |
        # Se è un TAG o se l'utente sceglie 'all', compiliamo tutto normalmente
        if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.event.inputs.architecture }}" == "all" ]]; then
          echo "Building all architectures..."
          ./gradlew assembleOssRelease --stacktrace
        else
          # Se l'utente sceglie un'architettura specifica, usiamo la property 'injected.abi'
          # Questo evita di compilare le altre architetture risparmiando tempo.
          echo "Building only for: ${{ github.event.inputs.architecture }}"
          ./gradlew assembleOssRelease -Pandroid.injected.abi=${{ github.event.inputs.architecture }} --stacktrace
        fi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v6
      with:
        # Il nome dell'artefatto cambierà in base alla scelta (es: round-sync-arm64-v8a)
        name: round-sync-${{ github.event.inputs.architecture || 'full-release' }}
        path: app/build/outputs/apk/oss/release/*.apk
        if-no-files-found: warn

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/oss/release/*.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
