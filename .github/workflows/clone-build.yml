name: Clone & Build APK from upstream

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  clone-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/gulp79/Round-Sync.git || true
          git fetch upstream master --depth=50

      - name: Merge upstream code
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git merge upstream/master --allow-unrelated-histories -X theirs || git commit --allow-empty -m "Merge upstream"
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.6'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 27.3.13750724

      - name: Generate secure keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v \
            -keystore $HOME/.android/release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release-key \
            -storepass ReleaseKeyPass2024! \
            -keypass ReleaseKeyPass2024! \
            -dname "CN=Round-Sync, OU=Development, O=Round-Sync, L=Web, ST=Online, C=US" || echo "Keystore already exists"

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << 'EOF'
          storeFile=${{ env.HOME }}/.android/release.keystore
          storePassword=ReleaseKeyPass2024!
          keyAlias=release-key
          keyPassword=ReleaseKeyPass2024!
          EOF

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build APK Release (OSS flavor)
        run: |
          ./gradlew assembleOssRelease \
            --build-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Build APK Release (RS flavor)
        run: |
          ./gradlew assembleRsRelease \
            --build-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m" || echo "RS flavor build skipped or failed"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        continue-on-error: true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-release-build
          path: app/build/outputs/apk/
          retention-days: 30

      - name: List generated APKs
        if: always()
        run: |
          echo "📦 Generated APK files:"
          if [ -d "app/build/outputs/apk" ]; then
            find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
          else
            echo "No APK output directory found"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f $HOME/.android/release.keystore
          rm -f keystore.properties
