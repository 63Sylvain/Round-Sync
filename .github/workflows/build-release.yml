name: Build APK Release

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.6'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 27.3.13750724

      - name: Create keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release-key \
            -storepass 'ReleaseKeyStorePassword123!' \
            -keypass 'ReleaseKeyPassword123!' \
            -dname "CN=Round-Sync-Build, OU=Build, O=Round-Sync, L=Internet, ST=Online, C=US"
          
          echo "keystore_path=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
          echo "keystore_password=ReleaseKeyStorePassword123!" >> $GITHUB_ENV
          echo "key_alias=release-key" >> $GITHUB_ENV
          echo "key_password=ReleaseKeyPassword123!" >> $GITHUB_ENV

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=${{ env.keystore_password }}
          keyAlias=${{ env.key_alias }}
          keyPassword=${{ env.key_password }}
          EOF

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build APK Release (OSS)
        run: ./gradlew assembleOssRelease --build-cache --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Build APK Release (Main Flavor)
        run: ./gradlew assembleRsRelease --build-cache --stacktrace || true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK artifacts (Latest)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-release-latest
          path: app/build/outputs/apk/
          retention-days: 30

      - name: Find and List APK files
        if: always()
        run: |
          echo "📦 Generated APK files:"
          find app/build/outputs/apk -name "*.apk" -type f | while read file; do
            echo "✅ $file ($(du -h "$file" | cut -f1))"
          done

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -f release.keystore
