name: Build APK Release

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: rclone/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.3.13750724'

      - name: Create keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release-key \
            -storepass ReleaseKeyPass2024! \
            -keypass ReleaseKeyPass2024! \
            -dname "CN=Round-Sync, OU=Development, O=Round-Sync, L=Web, ST=Online, C=US"
          cp release.keystore app/release.keystore

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << 'EOF'
          storeFile=release.keystore
          storePassword=ReleaseKeyPass2024!
          keyAlias=release-key
          keyPassword=ReleaseKeyPass2024!
          EOF
          cp keystore.properties app/keystore.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build APK Release (OSS)
        run: ./gradlew assembleOssRelease --build-cache --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          CMD_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          CMD_RELEASE_KEYSTORE_PASSWORD: ReleaseKeyPass2024!
          CMD_RELEASE_KEY_ALIAS: release-key
          CMD_RELEASE_KEY_PASSWORD: ReleaseKeyPass2024!

      - name: Build APK Release (Main Flavor)
        run: ./gradlew assembleRsRelease --build-cache --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          CMD_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          CMD_RELEASE_KEYSTORE_PASSWORD: ReleaseKeyPass2024!
          CMD_RELEASE_KEY_ALIAS: release-key
          CMD_RELEASE_KEY_PASSWORD: ReleaseKeyPass2024!

      - name: Upload APK artifacts (Latest)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-release-latest
          path: app/build/outputs/apk/
          retention-days: 30

      - name: Find and List APK files
        if: always()
        run: |
          echo "📦 Generated APK files:"
          find app/build/outputs/apk -name "*.apk" -type f | while read file; do
            echo "✅ $file ($(du -h "$file" | cut -f1))"
          done

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -f release.keystore app/release.keystore keystore.properties app/keystore.properties
